<svg xmlns="http://www.w3.org/2000/svg" width="880" height="190" viewBox="0 0 880 190" role="img" aria-label="Uplink — channels open for roles, freelance and collaborations">
  <defs>
    <pattern id="bp" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#202c26" stroke-width="0.6" opacity="0.55"/></pattern>
    <radialGradient id="glow" cx="12%" cy="50%" r="45%"><stop offset="0" stop-color="#2dd49a" stop-opacity="0.14"/><stop offset="1" stop-color="#2dd49a" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}
    .d{font-family:'Space Grotesk','Segoe UI',Inter,Helvetica,Arial,sans-serif}
    .lbl{font-size:10.5px;letter-spacing:2.2px;fill:#7a8f84}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
    .dot{animation:blink 1.8s ease-in-out infinite}
  </style>
  <rect width="880" height="190" rx="10" fill="#070a09"/>
  <rect width="880" height="190" rx="10" fill="url(#bp)"/>
  <rect width="880" height="190" rx="10" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="879" height="189" rx="10" fill="none" stroke="#202c26"/>
  <path d="M1 14V1H14M866 1H879V14M879 176V189H866M14 189H1V176" fill="none" stroke="#2dd49a" stroke-opacity="0.55" stroke-width="1.5"/>

  <g transform="translate(92 95)">
    <circle r="11" fill="none" stroke="#2dd49a" stroke-width="2"/>
    <circle r="12" fill="none" stroke="#2dd49a" stroke-width="1.5">
      <animate attributeName="r" values="12;42;12" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#2dd49a"/>
  </g>

  <text x="160" y="46" class="m lbl" style="fill:#2dd49a">UPLINK · CHANNELS OPEN</text>
  <text x="160" y="84" class="d" font-size="24" font-weight="700" letter-spacing="-0.5" fill="#e1f0e8">Let's build something.</text>
  <text x="160" y="112" class="d" font-size="14.5" fill="#a9bdb2">Open to full-time roles, freelance builds and collaborations —</text>
  <text x="160" y="132" class="d" font-size="14.5" fill="#a9bdb2">from a public API to a full product, end to end.</text>
  <g class="m" font-size="11.5">
    <circle class="dot" cx="164" cy="160" r="3.5" fill="#2dd49a"/>
    <text x="176" y="164" fill="#2dd49a">ONLINE</text>
    <text x="232" y="164" fill="#7a8f84">· usually replies within a day · Dhaka (UTC+6)</text>
  </g>
  <text x="852" y="164" text-anchor="end" class="m" font-size="11.5" fill="#e1f0e8">latiful.dev@gmail.com</text>
</svg>
