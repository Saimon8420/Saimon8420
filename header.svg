<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" role="img" aria-label="Md. Latiful Kabir — operator console">
  <defs>
    <pattern id="bp" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#202c26" stroke-width="0.6" opacity="0.6"/></pattern>
    <radialGradient id="glow" cx="18%" cy="30%" r="60%"><stop offset="0" stop-color="#2dd49a" stop-opacity="0.13"/><stop offset="1" stop-color="#2dd49a" stop-opacity="0"/></radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd49a" stop-opacity="0"/><stop offset="0.5" stop-color="#2dd49a" stop-opacity="0.08"/><stop offset="1" stop-color="#2dd49a" stop-opacity="0"/></linearGradient>
    <clipPath id="card"><rect x="28" y="64" width="540" height="190" rx="6"/></clipPath>
    <clipPath id="log"><rect x="130" y="270" width="722" height="30"/></clipPath>
  </defs>
  <style>
    .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}
    .d{font-family:'Space Grotesk','Segoe UI',Inter,Helvetica,Arial,sans-serif}
    .lbl{font-size:10.5px;letter-spacing:2.2px;fill:#7a8f84}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
    .dot{animation:blink 2.4s ease-in-out infinite}
    @keyframes blip{0%,100%{opacity:.35}50%{opacity:1}}
    .b{animation:blip 1.8s ease-in-out infinite}
  </style>

  <rect width="880" height="320" rx="10" fill="#070a09"/>
  <rect width="880" height="320" rx="10" fill="url(#bp)"/>
  <rect width="880" height="320" rx="10" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="879" height="319" rx="10" fill="none" stroke="#202c26"/>
  <path d="M1 16V1H16M864 1H879V16M879 304V319H864M16 319H1V304" fill="none" stroke="#2dd49a" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- top bar -->
  <g class="m">
    <rect x="28" y="24" width="14" height="12" rx="2" fill="#2dd49a"/>
    <path d="M31.5 27.5l3 2.5-3 2.5M36 33h3" stroke="#070a09" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <text x="50" y="35" font-size="13" font-weight="600" fill="#e1f0e8">latiful.kabir</text>
    <circle class="dot" cx="158" cy="31" r="3.5" fill="#2dd49a"/>
    <text x="852" y="35" text-anchor="end" class="lbl">OPERATOR CONSOLE · @SAIMON8420</text>
  </g>

  <!-- ID card -->
  <rect x="28.5" y="64.5" width="539" height="189" rx="6" fill="#0e1310" stroke="#202c26"/>
  <path d="M29 76V65H40M556 65H567V76M567 242V253H556M40 253H29V242" fill="none" stroke="#2dd49a" stroke-opacity="0.5" stroke-width="1.3"/>
  <g clip-path="url(#card)">
    <rect x="28" y="-20" width="540" height="80" fill="url(#scan)">
      <animate attributeName="y" values="-20;260;-20" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g class="m">
    <circle class="dot" cx="54" cy="92" r="3.5" fill="#2dd49a"/>
    <text x="66" y="96" class="lbl">OPERATOR · ONLINE</text>
  </g>
  <text x="52" y="152" class="d" font-size="44" font-weight="700" letter-spacing="-1.3" fill="#e1f0e8">Md. Latiful Kabir</text>
  <text x="54" y="182" class="m lbl" fill="#2dd49a" style="fill:#2dd49a">SOFTWARE ENGINEER · GEN AI @ FLOWGENX</text>
  <text x="54" y="222" class="d" font-size="15.5" fill="#a9bdb2">Full-stack engineer — I build the product,
    <tspan fill="#e1f0e8" font-weight="600">and the API underneath it.</tspan></text>

  <!-- live readout -->
  <rect x="588.5" y="64.5" width="263" height="189" rx="6" fill="#0e1310" stroke="#202c26"/>
  <g class="m" font-size="12.5">
    <text x="608" y="96" fill="#7a8f84">status</text><text x="832" y="96" text-anchor="end" fill="#2dd49a">● online</text>
    <text x="608" y="122" fill="#7a8f84">based</text><text x="832" y="122" text-anchor="end" fill="#e1f0e8">Dhaka, BD</text>
    <text x="608" y="148" fill="#7a8f84">hiring</text><text x="832" y="148" text-anchor="end" fill="#f5b84a">● open</text>
    <text x="608" y="174" fill="#7a8f84">apis</text><text x="832" y="174" text-anchor="end" fill="#e1f0e8"><tspan fill="#2dd49a">10</tspan> live</text>
    <text x="608" y="200" fill="#7a8f84">shipped</text><text x="832" y="200" text-anchor="end" fill="#e1f0e8"><tspan fill="#2dd49a">60+</tspan> apps</text>
  </g>
  <g fill="#2dd49a">
    <rect class="b" x="608" y="222" width="20" height="5" rx="1"/>
    <rect class="b" x="630.4" y="222" width="20" height="5" rx="1" style="animation-delay:.12s"/>
    <rect class="b" x="652.8" y="222" width="20" height="5" rx="1" style="animation-delay:.24s"/>
    <rect class="b" x="675.2" y="222" width="20" height="5" rx="1" style="animation-delay:.36s"/>
    <rect class="b" x="697.6" y="222" width="20" height="5" rx="1" style="animation-delay:.48s"/>
    <rect class="b" x="720" y="222" width="20" height="5" rx="1" style="animation-delay:.6s"/>
    <rect class="b" x="742.4" y="222" width="20" height="5" rx="1" style="animation-delay:.72s"/>
    <rect class="b" x="764.8" y="222" width="20" height="5" rx="1" style="animation-delay:.84s"/>
    <rect class="b" x="787.2" y="222" width="20" height="5" rx="1" style="animation-delay:.96s"/>
    <rect class="b" x="809.6" y="222" width="22" height="5" rx="1" style="animation-delay:1.08s"/>
  </g>

  <!-- deploy log ticker -->
  <line x1="28" y1="270" x2="852" y2="270" stroke="#202c26"/>
  <text x="28" y="291" class="m lbl" style="fill:#2dd49a">DEPLOY LOG ▸</text>
  <g clip-path="url(#log)">
    <g class="m" font-size="11.5" fill="#7a8f84">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-720 0" dur="26s" repeatCount="indefinite"/>
      <text x="134" y="291" xml:space="preserve">miqaat <tspan fill="#2dd49a">✓ 200</tspan>   horizon <tspan fill="#2dd49a">✓ 200</tspan>   orrery <tspan fill="#2dd49a">✓ 200</tspan>   swelter <tspan fill="#2dd49a">✓ 200</tspan>   declino <tspan fill="#2dd49a">✓ 200</tspan>   parallax <tspan fill="#2dd49a">✓</tspan>   canvo <tspan fill="#2dd49a">✓</tspan>   awqat <tspan fill="#2dd49a">✓</tspan>  </text>
      <text x="854" y="291" xml:space="preserve">miqaat <tspan fill="#2dd49a">✓ 200</tspan>   horizon <tspan fill="#2dd49a">✓ 200</tspan>   orrery <tspan fill="#2dd49a">✓ 200</tspan>   swelter <tspan fill="#2dd49a">✓ 200</tspan>   declino <tspan fill="#2dd49a">✓ 200</tspan>   parallax <tspan fill="#2dd49a">✓</tspan>   canvo <tspan fill="#2dd49a">✓</tspan>   awqat <tspan fill="#2dd49a">✓</tspan>  </text>
    </g>
  </g>
</svg>
