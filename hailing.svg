<svg viewBox="0 0 850 190" width="850" height="190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hailing frequencies — channels open">
  <defs>
    <radialGradient id="hf" cx="50%" cy="120%" r="90%"><stop offset="0" stop-color="#ff9a52" stop-opacity="0.14"/><stop offset="1" stop-color="#000000" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="4" y="4" width="842" height="182" rx="16" fill="#070b16" stroke="#1e2a4a"/>
  <rect x="4" y="4" width="842" height="182" rx="16" fill="url(#hf)"/>
  <g fill="#dbe4f3">
    <circle cx="90" cy="40" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="30" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="44" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="150" r="1"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="150" r="1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.7s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(120,95)">
    <circle r="10" fill="none" stroke="#ff9a52" stroke-width="2"/>
    <circle r="20" fill="none" stroke="#ff9a52" stroke-opacity="0.5" stroke-width="1.5"><animate attributeName="r" values="12;40;12" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#ffb057"/>
  </g>
  <text x="185" y="78" fill="#eef1f7" font-size="20" font-weight="700" font-family="Georgia,serif">Channels open.</text>
  <text x="185" y="106" fill="#9aa3b6" font-size="13.5" font-family="-apple-system,Segoe UI,Arial,sans-serif">Available for full-time roles, freelance builds &amp; collaborations —</text>
  <text x="185" y="126" fill="#9aa3b6" font-size="13.5" font-family="-apple-system,Segoe UI,Arial,sans-serif">from a public API to a full product, end to end.</text>
  <g font-family="ui-monospace,Consolas,monospace" font-size="11.5">
    <circle cx="192" cy="152" r="3.5" fill="#6ee7b7"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="204" y="156" fill="#6ee7b7">ONLINE</text>
    <text x="262" y="156" fill="#5b6b8c">&#183; usually replies within a day &#183; Dhaka (UTC+6)</text>
  </g>
  <text x="810" y="176" fill="#3f4a63" font-size="10.5" text-anchor="end" font-family="Georgia,serif" font-style="italic">the sky, shipped as APIs &#10022;</text>
</svg>
